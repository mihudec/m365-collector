source: graph
# Optional: keep the original payload separate from Vector metadata.
# wrap: entra
graph_version: v1.0
signin_types:
  - interactiveUser
# For nonInteractiveUser, servicePrincipal or managedIdentity, opt into beta.
tenant_id: 11111111-1111-1111-1111-111111111111
client_id: 22222222-2222-2222-2222-222222222222
state_path: /var/lib/m365-collector/collector.db
# Used only with source: activity (Graph does not collect SharePoint activity).
content_types:
  - Audit.AzureActiveDirectory
  - Audit.Exchange
  - Audit.SharePoint
  - Audit.General
# DLP.All requires additional permissions.
lookback: 24h
overlap: 1h
lag: 5m
interval: 5m
timeout: 60s
# Optional age-encrypted client secret instead of M365_CLIENT_SECRET:
# secret_file: /etc/m365-collector/client-secret.age
# identity_file: /etc/m365-collector/identity.key

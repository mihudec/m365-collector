name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$VERSION^{commit}")"
      - run: make check
      - name: Build
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: make build
      - name: Package
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist/release
          for os in linux macos; do
            for arch in amd64 arm64; do
              tar -czf "dist/release/m365-collector_${VERSION}_${os}_${arch}.tar.gz" -C "dist/$os/$arch" m365-collector -C "$GITHUB_WORKSPACE" README.md examples
            done
          done
          cd dist/release
          sha256sum *.tar.gz > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$VERSION" dist/release/* --verify-tag --generate-notes
